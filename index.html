<!DOCTYPE html>
<html lang="pt-br">

    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/x-icon" href="./assets/image/icons/spider.svg">
        <title>Spider-Man</title>
        <!-- Styles -->
        <link rel="stylesheet" href="./css/style.css">
    </head>

    <body>
        <header>
            <nav class="s-menu">
                <ul class="s-menu__list">
                    <li class="s-menu__item"><a href="#">Pagina Inicial</a></li>
                    <li class="s-menu__item"><a href="/pages/tobeyMaguire/spiderman2002.html">Tobey Maguire</a></li>
                    <li class="s-menu__item s-menu__icon">
                        <img src="./assets/image/icons/spider.svg" alt="simbolo do homem aranha">
                    </li>
                    <li class="s-menu__item"><a href="#">Simon Garfunkel</a></li>
                    <li class="s-menu__item"><a href="#">Tom Holland</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <div class="s-container">
                
                <div class="s-card-carousel" style="transform: translateZ(-40vw) rotatey(0deg);">
                    <a href="/pages/tobeyMaguire/spiderman2002.html" class="s-card" id="spider-man-01">
                        <img class="s-card__background" src="./assets/backgrounds/pic-sm-bg-01.jpg" >
                        <img class="s-card__img" src="./assets/backgrounds/spider-man-01.png" alt="Tobey Maguire como o Homem Aranha">
                        <h2 class="s-card__title">Tobey Maguire</h2>
                    </a>

                    <a href="/pages/andrewGarfield/spiderman2012.html" class="s-card" id="spider-man-02">
                        <img class="s-card__background" src="./assets/backgrounds/pic-sm-bg-02.jpg" >
                        <img class="s-card__img" src="./assets/backgrounds/spider-man-02.png" alt="Andrew Garfield como o Homem Aranha">
                        <h2 class="s-card__title">Andrew Garfield</h2>
                    </a>

                    <a href="/pages/tomHolland/spiderman2017.html" class="s-card" id="spider-man-03">
                        <img class="s-card__background" src="./assets/backgrounds/pic-sm-bg-03.jpg" >
                        <img class="s-card__img" src="./assets/backgrounds/spider-man-03.png" alt="Tom Holland como o Homem Aranha">
                        <h2 class="s-card__title">Tom Holland</h2>
                    </a>
                </div>
                
            </div>
            
            <div class="s-controller">
                <div id="1" onclick=selectCarouselItem(this) class="s-controller__button s-controller__button--active">
                    01
                </div>

                <div id="2" onclick=selectCarouselItem(this) class="s-controller__button ">
                    02
                </div>

                <div id="3" onclick=selectCarouselItem(this) class="s-controller__button ">
                    03
                </div>

                <div class="s-controller__line"></div>
            </div>
            
        </main>

        <footer></footer>

        <!-- Scripts -->
        <script src="./engine/main-engine.js" defer></script>    
    </body>

</html>
